services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./emochess_backend/.env
    ports:
      - "5432:5432"
    volumes:
      - emochess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./emochess_backend
    restart: unless-stopped
    env_file:
      - ./emochess_backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  emochess_pgdata:

